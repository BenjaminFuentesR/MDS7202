[project]
name = "laboratorio-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apache-airflow>=3.2.2",
    "fastapi==0.135.1",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.6",
    "kaleido>=1.3.0",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.8",
    "missingno>=0.5.2",
    "mlflow==3.13.0",
    "nltk>=3.9.4",
    "numba>=0.53.1",
    "numpy>=2.4.3",
    "openpyxl>=3.1.5",
    "optuna==4.9.0",
    "pandas==2.3.3",
    "pillow>=12.1.1",
    "pip>=26.1.2",
    "plotly==6.8.0",
    "polars>=1.41.2",
    "pre-commit>=4.5.1",
    "protobuf==6.33.6",
    "pyarrow>=24.0.0",
    "ruff==0.15.12",
    "scikit-learn==1.8.0",
    "setuptools<82.0.0",
    "shap>=0.51.0",
    "umap-learn>=0.5.12",
    "uvicorn==0.42.0",
    "xgboost>=3.2.0",
]


[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors: errores de estilo (indentación, espacios, etc.)
    "W",   # pycodestyle warnings: advertencias de estilo menores
    "F",   # pyflakes: imports no usados, variables indefinidas, nombres duplicados
    "I",   # isort: orden y agrupación correcta de imports
    "B",   # flake8-bugbear: patrones propensos a bugs y malas prácticas
    "UP",  # pyupgrade: modernización automática de sintaxis a Python 3.12+
]
ignore = [
    "E501", # line-too-long: largo de línea (delegado a ruff-format)
]
